CONFIG_ZMK_KEYBOARD_NAME="Nik_keyb"
CONFIG_ZMK_SPLIT=y

# --- Power & Sleep Settings ---
# uses very little power, but it may take a few seconds to reconnect after waking.
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_SLEEP=y
# 45 minutes, 1.800.000 ms = 30 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=2700000

# --- Bluetooth ---
# increase bluetooth signal power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# disables the 2M PHY, improves host compatibility (app/Kconfig:200)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# implies BT_SMP_ALLOW_UNAUTH_OVERWRITE (app/Kconfig:182).
# Lets a host that regenerated its BLE keys re-pair over the existing bond.
# Windows regenerates keys across driver updates and sleep cycles.
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
# EXPERIMENTAL_SEC implies passkey entry (app/Kconfig:198). Disable it,
# otherwise pairing demands a passkey typed on the keyboard.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# --- Debouncing ---
# Held at the 5ms default. Lower values risk switch chatter, which emits
# repeated Shift press events from a single home-row-mod hold.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
